[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "directional-support-sampling"
version = "1.0.0"
description = "Directional support sampling for oriented object localization in UAV imagery"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0,<3", "numpy>=1.24,<2", "Pillow>=9.4",
    "scipy>=1.10", "PyYAML>=6", "opencv-python>=4.8,<4.12",
    "shapely>=2.0,<3", "transformers>=4.46,<4.47"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["dds*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
